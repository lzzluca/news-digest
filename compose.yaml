services:
  news-digest:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1001}
        APP_GID: ${APP_GID:-1001}
    restart: unless-stopped
    # Never root. APP_UID/APP_GID come from .env: a dedicated host user with no sudo and
    # no Docker access, so escaping the container gains nothing. Defaults to 1001 (luca).
    user: "${APP_UID:-1001}:${APP_GID:-1001}"
    env_file: .env
    volumes:
      # The code, read-only: the container must not be able to change what the host runs
      # (compose.yaml above all, which the auto-deploy applies).
      - type: bind
        source: .
        target: /workspace
        read_only: true
      # The only place it writes: the generated feeds, served on http://news-digest:8080/.
      - type: bind
        source: ./out
        target: /workspace/out
      # Named volume: Claude CLI config and the Whisper model survive rebuilds.
      - type: volume
        source: home
        target: /home/app
      # Secrets that are files (YouTube cookies), read-only. git-ignored, mode 600 on the host.
      - type: bind
        source: ./secrets
        target: /run/secrets
        read_only: true
    # Guardrails: an episode may take hours, it must not starve FreshRSS and the blog.
    cpus: 3
    mem_limit: 4g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # No Docker socket, no published ports. Same network as FreshRSS, reached by its service name.
    # The main process (the feed server) is the image's CMD, see the Dockerfile.
    networks:
      - freshrss

volumes:
  home:

networks:
  freshrss:
    external: true
    name: freshrss_default
